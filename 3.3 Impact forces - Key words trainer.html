const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const st={name:'',cls:'',lang:'both',t0:0,card:{},fcDone:0,match:{games:0,best:null,errors:0,pairs:0},qz:null,miss:{}};
const T=D.terms;
$('#hLogo').src=D.logoPng;$('#stLogo').src=D.logoPng;
$('#stTitle').textContent='Key words: '+D.code+' '+D.title;$('#title').textContent='Key words trainer: '+D.code+' '+D.title;$('#sub').textContent=D.chapter;
$('#lang').addEventListener('change',()=>document.querySelectorAll('#lang label').forEach(l=>l.classList.toggle('sel',l.querySelector('input').checked)));
$('#go').onclick=()=>{const n=$('#nm').value.trim(),c=$('#cl').value.trim();if(!n){$('#stErr').textContent='Please enter your name.';return}if(!c){$('#stErr').textContent='Please enter your class.';return}
  st.name=n;st.cls=c;st.lang=document.querySelector('#lang input:checked').value;st.t0=Date.now();$('#start').style.display='none';$('#who').innerHTML='<b>'+esc(n)+'</b> · '+esc(c);init()};
const TABS=[['fc','Flashcards'],['mt','Match game'],['qz','Quiz'],['r','My report']];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function trHTML(t){let h='';if(st.lang!='ru')h+='<div class="ar" lang="ar" dir="rtl">'+esc(t.ar)+'</div>';if(st.lang!='ar')h+='<div class="ru" lang="ru">'+esc(t.ru)+'</div>';return h}
function say(text,lang){try{const u=new SpeechSynthesisUtterance(text);u.lang=lang||'en-GB';u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function init(){
  const nv=$('#nv');nv.innerHTML='';TABS.forEach(([k,t])=>{const b=document.createElement('button');b.dataset.k=k;b.innerHTML=t+'<span class="ct" id="ct-'+k+'"></span>';b.onclick=()=>show(k);nv.appendChild(b)});
  T.forEach(t=>st.card[t.en]=null);buildFC();buildMT();buildQZ();show('fc');upd();
}
function show(k){document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id=='s-'+k));document.querySelectorAll('#nv button').forEach(b=>b.classList.toggle('on',b.dataset.k==k));if(k=='r')buildR();window.scrollTo({top:0,behavior:'smooth'})}
function upd(){const kn=Object.values(st.card).filter(v=>v!==null).length;const q=st.qz?st.qz.done:0,qn=st.qz?st.qz.qs.length:0;
  $('#pb').style.width=(100*((kn/T.length)*0.4+(st.match.games?0.2:0)+(qn?0.4*q/qn:0)))+'%';
  $('#ct-fc').textContent=kn+'/'+T.length;$('#ct-mt').textContent=st.match.games?' ✓':'';$('#ct-qz').textContent=q+'/'+qn;if($('#s-r').classList.contains('on'))buildR()}
/* flashcards */
let fi=0,order=[];
function buildFC(){order=shuffle(T.map((_,i)=>i));fi=0;drawFC()}
function drawFC(){
  const s=$('#s-fc');const t=T[order[fi]];
  s.innerHTML='<div class="call">Read the word, say it aloud, then click the card to see the definition and the translation. Be honest: choose <b>I know it</b> or <b>Practise again</b>.</div><div class="stat"><span>Card '+(fi+1)+' of '+T.length+'</span><span id="kc"></span></div>'+
  '<div class="fc" id="fc"><div class="in2"><div class="f"><div class="term">'+esc(t.en)+'</div><button class="say" id="sayB" title="Hear the word">🔊</button><div class="hint">Click the card to turn it over</div></div><div class="b"><div style="font-weight:800;color:var(--b);font-size:22px;margin-bottom:6px">'+esc(t.en)+'</div><div class="def">'+esc(t.def)+'</div><div class="tr">'+trHTML(t)+'</div></div></div></div>'+
  '<div class="acts" style="justify-content:center"><button class="btn sec" id="prev">← Back</button><button class="btn" id="kn" style="background:var(--ok)">✓ I know it</button><button class="btn or" id="pr">↻ Practise again</button><button class="btn sec" id="nx">Next →</button></div>';
  const fc=$('#fc');fc.onclick=e=>{if(e.target.id=='sayB')return;fc.classList.toggle('flip')};
  $('#sayB').onclick=e=>{e.stopPropagation();say(t.en)};
  const go=d=>{fi=(fi+d+T.length)%T.length;drawFC()};
  $('#prev').onclick=()=>go(-1);$('#nx').onclick=()=>go(1);
  $('#kn').onclick=()=>{st.card[t.en]=true;upd();if(fi<T.length-1)go(1);else drawFC()};
  $('#pr').onclick=()=>{st.card[t.en]=false;upd();if(fi<T.length-1)go(1);else drawFC()};
  const kc=Object.values(st.card).filter(v=>v===true).length;$('#kc').textContent='Known: '+kc;
  if(st.card[t.en]===true)fc.style.borderColor='';
}
/* match game */
let mm={mode:'tr',pairs:[],sel:null,done:0,t0:0,err:0};
function buildMT(){
  const s=$('#s-mt');
  s.innerHTML='<div class="call">Match each English word with its partner. Click one tile, then its partner.</div><div id="mtctl"><span class="seg" id="mmode"><button data-m="tr" class="on">Word ↔ translation</button><button data-m="def">Word ↔ definition</button></span> <button class="btn" id="mnew">New game</button></div><div class="stat"><span id="mst"></span></div><div class="tiles" id="tiles"></div><div class="fb" id="mfb"></div>';
  $('#mmode').onclick=e=>{const b=e.target.closest('button');if(!b)return;mm.mode=b.dataset.m;document.querySelectorAll('#mmode button').forEach(x=>x.classList.toggle('on',x===b));newGame()};
  $('#mnew').onclick=newGame;newGame();
}
function newGame(){
  const n=Math.min(6,T.length);const pick=shuffle(T).slice(0,n);mm.sel=null;mm.done=0;mm.err=0;mm.t0=Date.now();mm.pairs=pick;
  const tiles=[];pick.forEach((t,i)=>{tiles.push({k:i,side:'en',html:'<b>'+esc(t.en)+'</b>',cls:''});
    if(mm.mode=='def')tiles.push({k:i,side:'x',html:esc(t.def),cls:''});
    else{const useAr=st.lang=='ar'||(st.lang=='both'&&i%2==0);tiles.push({k:i,side:'x',html:useAr?esc(t.ar):esc(t.ru),cls:useAr?'ar':'ru'})}});
  const box=$('#tiles');box.innerHTML='';$('#mfb').className='fb';
  shuffle(tiles).forEach(t=>{const b=document.createElement('button');b.className='tile '+t.cls;b.innerHTML=t.html;if(t.cls=='ar'){b.dir='rtl';b.lang='ar'}b.dataset.k=t.k;b.dataset.s=t.side;b.onclick=()=>tileClick(b);box.appendChild(b)});
  $('#mst').textContent='Pairs found: 0 of '+n;
}
function tileClick(b){
  if(b.classList.contains('done'))return;
  if(!mm.sel){mm.sel=b;b.classList.add('sel');return}
  if(mm.sel===b){b.classList.remove('sel');mm.sel=null;return}
  const a=mm.sel;a.classList.remove('sel');mm.sel=null;
  if(a.dataset.k==b.dataset.k&&a.dataset.s!=b.dataset.s){a.classList.add('done');b.classList.add('done');mm.done++;$('#mst').textContent='Pairs found: '+mm.done+' of '+mm.pairs.length;
    if(mm.done==mm.pairs.length){const sec=Math.round((Date.now()-mm.t0)/1000);st.match.games++;st.match.pairs+=mm.pairs.length;st.match.errors+=mm.err;if(st.match.best==null||sec<st.match.best)st.match.best=sec;const f=$('#mfb');f.className='fb ok';f.innerHTML='✓ All matched in '+sec+' seconds with '+mm.err+' mistake'+(mm.err==1?'':'s')+'. Press New game to play again.';upd()}}
  else{mm.err++;[a,b].forEach(x=>{x.classList.add('wrong');setTimeout(()=>x.classList.remove('wrong'),600)});const ta=mm.pairs[a.dataset.k].en,tb=mm.pairs[b.dataset.k].en;st.miss[ta]=(st.miss[ta]||0)+1;st.miss[tb]=(st.miss[tb]||0)+1}
}
/* quiz */
function buildQZ(){
  const qs=[];
  T.forEach(t=>{qs.push({t,type:'def'});qs.push({t,type:'tr'})});
  const Q=shuffle(qs).slice(0,Math.min(12,qs.length));
  Q.forEach(q=>{const others=shuffle(T.filter(x=>x.en!==q.t.en)).slice(0,3);q.opts=shuffle([q.t].concat(others));q.pick=null});
  st.qz={qs:Q,done:0};
  const s=$('#s-qz');s.innerHTML='<div class="call">Choose the correct English word. You will see the answer straight away.</div>';
  Q.forEach((q,i)=>{const c=document.createElement('div');c.className='card';
    let prompt;if(q.type=='def')prompt='<div class="qterm">Which word matches this definition?<br><i>'+esc(q.t.def)+'</i></div>';
    else{const useAr=st.lang=='ar'||(st.lang=='both'&&i%2==0);prompt='<div class="qterm">Which English word means: '+(useAr?'<span class="ar" lang="ar" dir="rtl" style="display:inline-block">'+esc(q.t.ar)+'</span>':'<span class="ru" lang="ru">'+esc(q.t.ru)+'</span>')+' ?</div>';q.shown=useAr?'Arabic':'Russian'}
    c.innerHTML='<div class="qh"><b>Question '+(i+1)+'</b></div>'+prompt+q.opts.map((o,k)=>'<button class="opt" data-k="'+k+'"><b>'+'ABCD'[k]+'</b>'+esc(o.en)+'</button>').join('')+'<div class="fb"></div>';
    c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;q.pick=k;st.qz.done++;const ok=q.opts[k].en===q.t.en;c.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const j=+x.dataset.k;if(q.opts[j].en===q.t.en)x.classList.add('c');else if(j==k)x.classList.add('w')});
      const f=c.querySelector('.fb');f.className='fb '+(ok?'ok':'bad');f.innerHTML=ok?'✓ Correct.':'✗ Not quite. The answer is <b>'+esc(q.t.en)+'</b>: '+esc(q.t.def);if(!ok)st.miss[q.t.en]=(st.miss[q.t.en]||0)+1;upd()});
    s.appendChild(c)});
  s.insertAdjacentHTML('beforeend','<div class="acts"><button class="btn" onclick="show(\'r\')">Finish: my report →</button></div>');
}
/* report */
function qscore(){const q=st.qz.qs;const ans=q.filter(x=>x.pick!=null);return{done:ans.length,ok:ans.filter(x=>x.opts[x.pick].en===x.t.en).length,n:q.length}}
function revise(){const r=new Set();T.forEach(t=>{if(st.card[t.en]===false)r.add(t.en)});st.qz.qs.forEach(q=>{if(q.pick!=null&&q.opts[q.pick].en!==q.t.en)r.add(q.t.en)});Object.keys(st.miss).forEach(k=>r.add(k));return T.filter(t=>r.has(t.en))}
function suggestions(){
  const q=qscore(),kn=Object.values(st.card).filter(v=>v===true).length,seen=Object.values(st.card).filter(v=>v!==null).length,out=[];const pct=q.done?Math.round(100*q.ok/q.done):null;
  if(seen<T.length)out.push('You have looked at '+seen+' of '+T.length+' flashcards. Go through every card, say each word aloud and decide honestly if you know it.');
  if(!st.match.games)out.push('Play the match game at least once. Matching words to translations and definitions helps you remember them.');
  if(q.done<q.n)out.push('Finish the quiz: you have answered '+q.done+' of '+q.n+' questions.');
  if(pct!=null){out.push(pct>=85?'Excellent quiz score. You know these key words well. Try writing a sentence for each word to use it in context.':pct>=60?'Good quiz score. Practise the words listed below, then play the quiz again.':'These words need more practice. Use the flashcards every day for a few minutes and read each definition aloud.')}
  const rv=revise();if(rv.length)out.push('Words to practise: '+rv.map(t=>t.en).join(', ')+'.');
  out.push('Use each new word in a sentence in your science book, and check the definition against your notes.');
  return out}
function buildR(){
  const q=qscore(),kn=Object.values(st.card).filter(v=>v===true).length,sg=suggestions(),rv=revise(),pct=q.done?Math.round(100*q.ok/q.done):0;
  let h='<div class="card"><h2>My report</h2><div><b>'+esc(st.name)+'</b> · '+esc(st.cls)+'</div><div class="sum"><div><b>'+kn+'/'+T.length+'</b>cards known</div><div><b>'+st.match.games+'</b>match games</div><div><b>'+q.ok+'/'+q.n+'</b>quiz score</div><div><b>'+rv.length+'</b>words to practise</div></div></div>';
  h+='<div class="card"><h2>Suggestions for improvement</h2><ul class="sg">'+sg.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  if(rv.length)h+='<div class="card"><h2>Words to practise</h2><table class="res"><tr><th>English</th><th>العربية</th><th>Русский</th></tr>'+rv.map(t=>'<tr><td><b>'+esc(t.en)+'</b></td><td lang="ar" dir="rtl">'+esc(t.ar)+'</td><td lang="ru">'+esc(t.ru)+'</td></tr>').join('')+'</table></div>';
  h+='<div class="acts"><button class="btn or big" id="dl">Download my report (PDF)</button><span style="color:var(--mute)">Made on your device. Nothing is sent anywhere. The PDF uses English words only.</span></div><div class="err" id="dlmsg"></div>';
  $('#s-r').innerHTML=h;$('#dl').onclick=makePDF}
function makePDF(){
  const q=qscore(),kn=Object.values(st.card).filter(v=>v===true).length,seen=Object.values(st.card).filter(v=>v!==null).length,sg=suggestions(),rv=revise(),P=MiniPDF();if(LOGO_PDF)P.setLogo(LOGO_PDF);
  P.logoHeader(120);P.h1('Key words '+D.code+': '+D.title+' - completion report');P.text(D.chapter,{size:10,color:[93,111,124]});
  const mins=Math.max(1,Math.round((Date.now()-st.t0)/60000));
  P.kv('Name',st.name);P.kv('Class',st.cls);P.kv('Date',new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}));P.kv('Time spent',mins+' minute'+(mins==1?'':'s'));
  P.h2('Results');
  P.bar('Flashcards marked as known',kn/T.length,kn+' of '+T.length);
  P.bar('Quiz score',q.n?q.ok/q.n:0,q.ok+' of '+q.n+(q.done<q.n?'  ('+q.done+' answered)':''));
  P.kv('Flashcards viewed',seen+' of '+T.length);
  P.kv('Match games',st.match.games?(st.match.games+' played, best time '+st.match.best+' s, '+st.match.errors+' mistakes in total'):'not played');
  P.h2('Suggestions for improvement');sg.forEach(x=>P.text('- '+x,{size:10,indent:8,after:4}));
  if(rv.length){P.h2('Words to practise');P.table(['Word','Definition'],rv.map(t=>[t.en,t.def]),[2,5],{boldFirst:true})}
  P.h2('Quiz answers');
  st.qz.qs.forEach((x,i)=>{const a=x.pick!=null,ok=a&&x.opts[x.pick].en===x.t.en;P.text('Q'+(i+1)+'  '+(x.type=='def'?'Definition: '+x.t.def:'Translation shown in '+(x.shown||'Arabic/Russian')+' - find the English word'),{size:9.5,bold:true,after:1});
    P.text((a?(ok?'Correct: ':'Your answer: '+x.opts[x.pick].en+'   |   Correct answer: '):'Not answered. Correct answer: ')+(a&&ok?x.t.en:x.t.en),{size:9.5,indent:8,after:5,color:a?(ok?[31,138,76]:[192,57,43]):[93,111,124]})});
  P.save('Key_words_'+D.code+'_'+D.title.replace(/[^A-Za-z0-9]+/g,'_')+'_report_'+st.name.replace(/[^A-Za-z0-9]+/g,'_')+'.pdf','Key words '+D.code+' report - '+st.name,'The Aquila School  -  Physics  -  '+st.name+' ('+st.cls+')');
  $('#dlmsg').textContent='Your report has been downloaded. Check your Downloads folder.';
}
window.__t={D,st,init,show,makePDF,qscore,revise};
</script></body></html>
