<script>/* MiniPDF: tiny dependency-free PDF writer (Helvetica, Latin text, wrapping, tables, bars). Works offline. */

  const MAP={'−':'-','–':'\x96','—':'\x97','‘':'\x91','’':'\x92','“':'\x93','”':'\x94','•':'\x95','…':'\x85','✓':'Yes','✗':'No','→':'->','≈':'~','Δ':'delta ','²':'\xb2','³':'\xb3','×':'\xd7','÷':'\xf7','°':'\xb0','·':'\xb7','₀':'0','₁':'1','₂':'2','₃':'3','₄':'4','₅':'5','₆':'6','₇':'7','₈':'8','₉':'9','θ':'theta','π':'pi','≤':'<=','≥':'>=','½':'\xbd','¼':'\xbc','★':'*','☆':'-','−':'-','\u00a0':' ',' ':' '};
  function enc(s){ let o=''; for(const ch of String(s)){ if(MAP[ch]!==undefined) o+=MAP[ch]; else { const c=ch.charCodeAt(0); o+=(c<256&&!(c>=127&&c<=159))?ch:'?'; } } return o; }

  }

    CW, M,
    setLogo(l){ LOGO=l; },
    logoHeader(w){ if(!LOGO) return; const h=w*LOGO.h/LOGO.w; y-=h; put(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${M} ${y.toFixed(2)} cm /Im1 Do Q`); y-=6; },
    yPos(){ return y; },
    newPage,
    gap(h){ y-=h; },
    rect(x,top,w,h,fill,stroke,lw){

    },
    text(s,o){ o=o||{}; const size=o.size||10, bold=!!o.bold, x=(o.x!==undefined?o.x:M)+(o.indent||0), width=(o.width||CW)-(o.indent||0);
      const lines=wrap(s,width,size,bold), lh=size*1.32;
      for(const ln of lines){ need(lh); y-=lh; let xx=x; if(o.align==='right') xx=x+width-tw(ln,size,bold); else if(o.align==='center') xx=x+(width-tw(ln,size,bold))/2; drawText(xx,y+size*0.25,ln,size,bold,o.color); }

    h1(s){ api.text(s,{size:20,bold:true,color:[47,107,151],after:2}); },

    },
    save(filename,title,footer){
      const N=pages.length;
      pages.forEach((p,i)=>{ p.push(`${col([47,107,151])} rg 0 ${PH-10} ${PW} 10 re f ${col([156,214,234])} rg 0 ${PH-14} ${PW} 4 re f ${col([156,214,234])} rg 0 0 ${PW} 5 re f`); const f=enc(footer||''); p.push(`BT /F1 8 Tf ${col([120,134,145])} rg ${M} 28 Td (${esc(f)}) Tj ET`); const pg=`Page ${i+1} of ${N}`; p.push(`BT /F1 8 Tf ${col([120,134,145])} rg ${(PW-M-tw(pg,8,false)).toFixed(2)} 28 Td (${pg}) Tj ET`); });

        obj(5+2*i,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+PW+' '+PH+'] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>'+(LOGO?' /XObject << /Im1 '+imgN+' 0 R >>':'')+' >> /Contents '+(6+2*i)+' 0 R >>');

o": "Safety features reduce the force on people in a crash by increasing the impact time. In this worksheet you will explain how they work and use momentum to find the speed of a car. The questions get harder as you go.", "key": ["Safety features such as <b>seat belts<\/b>, <b>air bags<\/b> and <b>crumple zones<\/b> increase the <b>time<\/b> over which a person stops. Because F = Δp ÷ t, a longer time gives a smaller force for the same change in momentum.", "Crash investigators use <b>conservation of momentum<\/b> to find the speed of a car before a crash, from the speed of the vehicles after the crash."], "key_title": null, "formula": {"eq": "F = Δp ÷ t", "words": "force = change in momentum ÷ time", "note": "Δp = final momentum − initial momentum.", "rows": [["<b>F<\/b>", "force", "N"], ["<b>Δp<\/b>", "change in momentum", "kg m/s"], ["<b>t<\/b>", "time", "s"]], "widths": [56, 110, 50], "tri": ["Δp", "F", "t"]}, "tip": null, "steps": ["Write down the masses and the speed after the crash, with units.", "Calculate the total mass after the crash.", "Calculate the total momentum after: total mass × speed.", "Total momentum before = total momentum after.", "Only the moving car had momentum before: v = p ÷ m (car).", "Write the answer with its unit and compare it with the speed limit."], "steps_title": "Step-by-step method: speed before a crash", "watch": ["Seat belts and air bags <b>increase the time<\/b> of the impact. They do not change Δp.", "The stationary vehicle has <b>zero<\/b> momentum before the crash.", "Use the <b>total mass<\/b> after the crash.", "Compare the speed with the speed limit in <b>m/s<\/b>."], "turn": null, "examples": [{"prob": "A driver has a change in momentum of 600 kg m/s. Calculate the force when the driver is stopped in 0.05 s by the steering wheel, and in 0.25 s by an air bag.", "hdr": ["Step", "What to do", "Working"], "rows": [["1", "Write down Δp", "Δp = 600 kg m/s"], ["2", "Steering wheel: t = 0.05 s", "F = 600 ÷ 0.05 = 12 000 N"], ["3", "Air bag: t = 0.25 s", "F = 600 ÷ 0.25 = 2400 N"], ["4", "Compare the forces", "The air bag force is 5 times smaller"], ["5", "Write the answer", "<b>The air bag reduces the force from 12 000 N to 2400 N<\/b>"]], "check": "the air bag increased the time by 5 times, so the force is 5 times smaller.", "img": null}, {"prob": "A car of mass 800 kg hits a stationary van of mass 1200 kg. They move together at 6.0 m/s. Calculate the speed of the car before the crash.", "hdr": ["Step", "What to do", "Working"], "rows": [["1", "Total mass after the crash", "800 + 1200 = 2000 kg"], ["2", "Total momentum after", "2000 × 6.0 = 12 000 kg m/s"], ["3", "Momentum before = momentum after", "800 × v = 12 000"], ["4", "Rearrange and divide", "v = 12 000 ÷ 800"], ["5", "Write the answer with its unit", "<b>v = 15 m/s<\/b>"]], "check": "the car was faster than the combined vehicles after the crash. 15 m/s is more than 6.0 m/s.", "img": null}], "qs": [{"s": 1, "h": "Guided: say how each feature helps.", "ans": "Seat belt: increases the time to stop and spreads the force across the chest. Air bag: spreads the force and increases the impact time. Crumple zone: increases the impact time. Cushioned surface: increases the impact time.", "q": "Write how each safety feature reduces the force on a person.", "table": {"header": ["Safety feature", "How it reduces the force"], "rows": [["Seat belt", ""], ["Air bag", ""], ["Crumple zone", ""], ["Cushioned playground surface", ""]], "widths": [160, 320]}, "unit": null, "label": null, "work": 0, "kind": "explain"}, {"s": 2, "h": "Hint: think about the time.", "ans": "Without a seat belt the passenger stops very quickly when the head hits the windscreen. The time is short, so the force is large. A seat belt increases the stopping time.", "q": "Explain why a passenger without a seat belt suffers a larger force in a sudden stop.", "unit": null, "label": null, "work": 0, "kind": "explain"}, {"s": 3, "h": "Hint: use the total mass.", "ans": "(750 + 2150) × 9 = 26 100 kg m/s.", "q": "A car of mass 750 kg crashes into a lorry of mass 2150 kg and they move together at 9 m/s. Calculate the momentum of the car and lorry together after the impact.", "unit": "kg m/s", "label": null, "work": 2, "exp": 26100.0, "kind": "calc"}, {"s": 3, "h": "Use F = Δp ÷ t.", "ans": "(a) 50 × 12 = 600 kg m/s. (b) 600 ÷ 0.40 = 1500 N.", "q": "A crash test dummy of mass 50 kg travelling at 12 m/s is stopped by a seat belt in 0.40 s.", "parts": [{"text": "(a) Calculate the change in momentum of the dummy.", "kind": "ans", "label": "Δp =", "unit": "kg m/s", "exp": 600.0}, {"text": "(b) Calculate the force on the dummy.", "kind": "ans", "label": "F =", "unit": "N", "exp": 1500.0}], "kind": "calc"}, {"s": 4, "h": "Find the speed before the crash.", "ans": "(a) 1500 × 8.0 = 12 000 kg m/s. (b) 12 000 ÷ 1000 = 12 m/s. (c) Yes: 12 m/s is more than 10 m/s.", "q": "A car of mass 1000 kg hits a stationary van of mass 500 kg. They move together at 8.0 m/s. The speed limit is 10 m/s.", "parts": [{"text": "(a) Calculate the total momentum after the crash.", "kind": "ans", "label": "p =", "unit": "kg m/s", "exp": 12000.0}, {"text": "(b) Calculate the speed of the car before the crash.", "kind": "ans", "label": "v =", "unit": "m/s", "exp": 12.0}, {"text": "(c) Was the car over the speed limit?", "kind": "ans", "label": "Answer:", "unit": "", "exp": null}], "kind": "calc"}], "mcq": []}, "ext": {"name": "Extend", "intro": "These questions ask you to explain safety features using momentum and to analyse crashes. Show every step of your working and give units.", "key": ["Safety features such as <b>seat belts<\/b>, <b>air bags<\/b> and <b>crumple zones<\/b> increase the <b>time<\/b> over which a person stops. Because F = Δp ÷ t, a longer time gives a smaller force for the same change in momentum.", "Crash investigators use <b>conservation of momentum<\/b> to find the speed of a car before a crash, from the speed of the vehicles after the crash."], "key_title": null, "formula": {"eq": "F = Δp ÷ t", "words": "force = change in momentum ÷ time", "note": "Δp = final momentum − initial momentum.", "rows": [["<b>F<\/b>", "force", "N"], ["<b>Δp<\/b>", "change in momentum", "kg m/s"], ["<b>t<\/b>", "time", "s"]], "widths": [56, 110, 50], "tri": ["Δp", "F", "t"]}, "tip": null, "steps": ["Write down the masses and the speed after the crash, with units.", "Calculate the total mass after the crash.", "Calculate the total momentum after: total mass × speed.", "Total momentum before = total momentum after.", "Only the moving car had momentum before: v = p ÷ m (car).", "Write the answer with its unit and compare it with the speed limit."], "steps_title": "Step-by-step method: speed before a crash", "watch": ["Seat belts and air bags <b>increase the time<\/b> of the impact. They do not change Δp.", "The stationary vehicle has <b>zero<\/b> momentum before the crash.", "Use the <b>total mass<\/b> after the crash.", "Compare the speed with the speed limit in <b>m/s<\/b>."], "turn": "The questions get harder as you go. Question 1 has a hint; Question 5 is a challenge. Show your working and give units.", "examples": [{"prob": "A car of mass 1000 kg hits a stationary lorry of mass 3000 kg. They move together at 5.0 m/s. Calculate the speed of the car before the crash.", "hdr": ["Step", "What to do", "Working"], "rows": [["1", "Total mass after the crash", "1000 + 3000 = 4000 kg"], ["2", "Total momentum after", "4000 × 5.0 = 20 000 kg m/s"], ["3", "Momentum before = momentum after", "1000 × v = 20 000"], ["4", "Rearrange and divide", "v = 20 000 ÷ 1000"], ["5", "Write the answer with its unit", "<b>v = 20 m/s<\/b>"]], "check": "20 m/s is four times the speed of the vehicles after the crash, because the lorry has three times the mass of the car.", "img": null}, {"prob": "A crash test dummy of mass 50 kg travels at 14 m/s. It is stopped in 0.04 s by a dashboard and in 0.20 s by an air bag. Compare the forces.", "hdr": ["Step", "What to do", "Working"], "rows": [["1", "Calculate the change in momentum", "Δp = 50 × 14 = 700 kg m/s"], ["2", "Dashboard force", "F = 700 ÷ 0.04 = 17 500 N"], ["3", "Air bag force", "F = 700 ÷ 0.20 = 3500 N"], ["4", "Compare the forces", "17 500 ÷ 3500 = 5"], ["5", "Write the answer", "<b>The air bag force is 5 times smaller<\/b>"]], "check": "the air bag stops the dummy in a time 5 times longer, so the force is 5 times smaller.", "img": null}], "qs": [{"s": 2, "h": "Hint: Δp = m × v.", "ans": "Δp = 75 × 16 = 1200 kg m/s. F = 1200 ÷ 0.40 = 3000 N.", "q": "A passenger of mass 75 kg travelling at 16 m/s is stopped by a seat belt in 0.40 s. Calculate the force on the passenger.", "unit": "N", "label": "F =", "work": 2, "exp": 3000.0, "kind": "calc"}, {"s": 3, "h": "Explain with F = Δp ÷ t.", "ans": "The driver has to lose all their momentum. The seat belt and the air bag increase the time taken to stop the driver and spread the force over the chest and upper body. F = Δp ÷ t, so for the same change in momentum a longer time gives a smaller force.", "q": "Explain how a seat belt and an air bag together reduce the force on a driver in a head-on crash.", "unit": null, "label": null, "work": 0, "kind": "explain"}, {"s": 4, "h": "Use conservation of momentum.", "ans": "(a) 2900 × 9 = 26 100 kg m/s (b) 26 100 ÷ 750 = 34.8 m/s (c) Yes: 34.8 m/s is more than 30 m/s.", "q": "A car of mass 750 kg crashed into a lorry of mass 2150 kg crossing the road. The speed limit is 30 m/s. After the crash the vehicles moved 6 m together. The speed of a vehicle after a braking distance of 6 m is 9 m/s.", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAbgAAAD8CAIAAACKFiYqAADqTElEQVR42uz96bMkWXYfiJ1z7r3uEW/LpbKquqp39AI0miC6hyA4pFEUx2ZAcsixmTETQf0BMNiY6Q+QSR80/wc/ykyUjWiSGcdG1FCgaJI4pgEJgEBjaxAE0Ohu1NaVVbm9F4v7veccfTjuN264e8SLt2RW1vK6kMgXGeHhfpffPcvv/A5+9+e/mjg2TUseBVRYiZCIYPtHVWH0owiA41dh4mf0NlWdfucBnwUAQhp/LyJc+0f1Jp+9wodxdJdX/Phl46OAqmjXRBSbEITEUFd1Yk5tPJ7PTo6PU5tiEiSHitpfxv5S/lm+CNuvI+LgRe1+UVG7KC function parseNum(v){if(v==null)return NaN;let s=String(v).replace(/−/g,'-').replace(/,/g,'').trim();s=s.replace(/(\d)\s+(?=\d{3}\b)/g,'$1');const m=s.match(/-?\d*\.?\d+(?:e-?\d+)?/i);return m?parseFloat(m[0]):NaN}
function numOK(v,e){const a=Math.abs(parseNum(v)),b=Math.abs(e);if(isNaN(a))return false;return Math.abs(a-b)<=Math.max(Math.abs(b)*0.015,1e-9)}

function score(){

  else if(e!=null&&h!=null&&h<.5)out.push('You are secure on the basics. To improve, practise the harder multi-step questions: write down what you know, choose the equation, then work through one step at a time.');
