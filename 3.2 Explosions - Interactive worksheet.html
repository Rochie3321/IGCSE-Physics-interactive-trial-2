xplosion, two objects push each other apart and the total momentum stays zero. In this worksheet you will use this idea to find recoil velocities. The questions get harder as you go.", "key": ["In an <b>explosion<\/b>, two objects push each other apart. Before the explosion they are at rest, so the total momentum is <b>zero<\/b>.", "After the explosion the total momentum is still zero. The two objects have momenta that are <b>equal in size<\/b> and <b>opposite in direction<\/b>. A gun recoils backwards when it fires a bullet forwards."], "key_title": null, "formula": {"eq": "m₁v₁ = − m₂v₂", "words": "momentum of one object = − momentum of the other", "note": "Two objects pushing each other apart from rest have equal and opposite momenta. The total momentum is zero.", "rows": [["<b>m<\/b>", "mass", "kg"], ["<b>v<\/b>", "velocity", "m/s"]], "widths": [56, 100, 50]}, "tip": null, "steps": ["Write down the masses and any velocity you know, with units.", "The total momentum before is zero (both are at rest).", "Calculate the momentum of the object whose velocity you know: p = m × v.", "The other object has the same size of momentum in the opposite direction.", "Divide by its mass to find its velocity: v = p ÷ m.", "Write the answer with its unit and say the direction."], "steps_title": "Step-by-step method", "watch": ["The momenta are equal and <b>opposite<\/b>. The total is <b>zero<\/b>, not double.", "The <b>lighter<\/b> object moves <b>faster<\/b> after an explosion.", "Say the <b>direction<\/b> of the velocity, or use a minus sign.", "Convert grams to <b>kg<\/b> before you calculate."], "turn": null, "examples": [{"prob": "A skater of mass 40 kg and a skater of mass 60 kg push each other apart. The 40 kg skater moves at 3.0 m/s. Calculate the velocity of the 60 kg skater.", "hdr": ["Step", "What to do", "Working"], "rows": [["1", "Momentum of the 40 kg skater", "p = 40 × 3.0 = 120 kg m/s"], ["2", "Total momentum is zero, so the other skater has", "120 kg m/s in the opposite direction"], ["3", "Write the equation", "v = p ÷ m"], ["4", "Substitute the numbers", "v = 120 ÷ 60"], ["5", "Write the answer", "<b>v = 2.0 m/s in the opposite direction<\/b>"]], "check": "the heavier skater moves more slowly than the lighter skater.", "img": null}, {"prob": "A gun of mass 4.0 kg fires a bullet of mass 0.010 kg at 400 m/s. Calculate the recoil velocity of the gun.", "hdr": ["Step", "What to do", "Working"], "rows": [["1", "Momentum of the bullet", "p = 0.010 × 400 = 4.0 kg m/s"], ["2", "Momentum of the gun", "4.0 kg m/s backwards"], ["3", "Write the equation", "v = p ÷ m"], ["4", "Substitute the numbers", "v = 4.0 ÷ 4.0"], ["5", "Write the answer", "<b>v = 1.0 m/s backwards<\/b>"]], "check": "the gun has a much bigger mass than the bullet, so it moves much more slowly.", "img": null}], "qs": [{"s": 1, "h": "Guided: complete the sentence.", "ans": "equal; opposite; zero.", "q": "Use these words: <b>zero, opposite, equal<\/b>.<br/>Two trolleys push each other apart from rest. Their momenta are [[_]] in size and [[_]] in direction. Their total momentum is [[_]] .", "blanks": ["equal", "opposite", "zero"], "unit": null, "label": null, "work": 0, "kind": "explain"}, {"s": 2, "h": "Hint: follow the steps in the method.", "ans": "(a) 120 kg m/s (b) 120 kg m/s in the opposite direction (c) 120 ÷ 80 = 1.5 m/s.", "q": "A skater of mass 60 kg and a skater of mass 80 kg push each other apart. The 60 kg skater moves at 2.0 m/s.", "parts": [{"text": "(a) Calculate the momentum of the 60 kg skater.", "kind": "ans", "label": "p =", "unit": "kg m/s", "exp": 120.0}, {"text": "(b) State the momentum of the 80 kg skater (size and direction).", "kind": "dots"}, {"text": "(c) Calculate the velocity of the 80 kg skater.", "kind": "ans", "label": "v =", "unit": "m/s", "exp": 1.5}], "kind": "calc"}, {"s": 3, "h": "Hint: total momentum is zero.", "ans": "600 × 0.5 = 12 × v, so v = 25 m/s.", "q": "A cannon of mass 600 kg recoils at 0.5 m/s when a cannon ball of mass 12 kg is fired. Calculate the velocity of the cannon ball.", "unit": "m/s", "label": null, "work": 3, "exp": 25.0, "kind": "calc"}, {"s": 3, "h": "Explain.", "ans": "The total momentum was zero before. The shell has forward momentum, so the gun must have equal and opposite momentum backwards.", "q": "Why does a gun recoil backwards when it fires a shell?", "unit": null, "label": null, "work": 0, "kind": "explain"}, {"s": 4, "h": "Use the method.", "ans": "(a) 6.0 × 0.50 = 3.0 kg m/s. (b) 3.0 kg m/s in the opposite direction. (c) 3.0 ÷ 2.0 = 1.5 m/s. (d) The 2.0 kg trolley, because it has less mass but the same size of momentum.", "q": "A trolley of mass 2.0 kg and a trolley of mass 6.0 kg are pushed apart by a spring. The 6.0 kg trolley moves at 0.50 m/s.", "parts": [{"text": "(a) Calculate the momentum of the 6.0 kg trolley.", "kind": "ans", "label": "p =", "unit": "kg m/s", "exp": 3.0}, {"text": "(b) State the momentum of the 2.0 kg trolley, with its direction.", "kind": "dots"}, {"text": "(c) Calculate the velocity of the 2.0 kg trolley.", "kind": "ans", "label": "v =", "unit": "m/s", "exp": 1.5}, {"text": "(d) Which trolley moves faster? Give a reason.", "kind": "dots"}], "kind": "calc"}], "mcq": [{"q": "Two skaters push each other apart from rest. Their total momentum after is…", "opts": ["zero", "double", "the same as one skater", "not known"], "ix": 0, "why": "It was zero before, so it is zero after."}]}, "ext": {"name": "Extend", "intro": "These questions use conservation of momentum in explosions, including recoil. Show every step of your working and give units and directions.", "key": ["In an <b>explosion<\/b>, two objects push each other apart. Before the explosion they are at rest, so the total momentum is <b>zero<\/b>.", "After the explosion the total momentum is still zero. The two objects have momenta that are <b>equal in size<\/b> and <b>opposite in direction<\/b>. A gun recoils backwards when it fires a bullet forwards."], "key_title": null, "formu function parseNum(v){if(v==null)return NaN;let s=String(v).replace(/−/g,'-').replace(/,/g,'').trim();s=s.replace(/(\d)\s+(?=\d{3}\b)/g,'$1');const m=s.match(/-?\d*\.?\d+(?:e-?\d+)?/i);return m?parseFloat(m[0]):NaN}
function numOK(v,e){const a=Math.abs(parseNum(v)),b=Math.abs(e);if(isNaN(a))return false;return Math.abs(a-b)<=Math.max(Math.abs(b)*0.015,1e-9)}
function wordOK(v,e){const n=x=>String(x).toLowerCase().replace(/[.\s]+$/,'').replace(/\s+/g,' ').trim();return n(v)==n(e)}
function qCard(q,i){
  const S=st.q[i],ins=[];
  const mk=(role,exp,kind,cls)=>{const el=document.createElement(kind=='ta'?'textarea':'input');el.className=cls||'in';if(kind!='ta'){el.type='text';if(kind=='num')el.setAttribute('inputmode','decimal')}el.autocomplete='off';const o={el,role,exp,kind,id:ins.length};ins.push(o);el.oninput=()=>{S.ans[o.id]=el.value;el.classList.remove('ok','bad');S.res=S.mark?S.res:null;upd(false)};return o};
  const card=document.createElement('div');card.className='card';card.id='q'+i;
  const head=document.createElement('div');head.className='qh';head.innerHTML='<b>Question '+(i+1)+'</b>'+stars(q.s)+(q.h?'<em>'+q.h+'</em>':'');card.appendChild(head);
  const body=document.createElement('div');
  let qh=q.q,bi=0;qh=qh.replace(/\[\[_\]\]/g,()=>'<span data-b="'+(bi++)+'"></span>');
  body.innerHTML='<div>'+qh+'</div>';card.appendChild(body);
  body.querySelectorAll('span[data-b]').forEach(sp=>{const k=+sp.dataset.b;const has=q.blanks&&q.blanks[k]!=null;const o=mk(has?'ans':'text',has?q.blanks[k]:null,'txt','blank');sp.replaceWith(o.el)});
  if(q.img){const im=document.createElement('img');im.className='qimg';im.style.maxWidth='320px';im.src=q.img;card.appendChild(im)}
  if(q.table){const t=document.createElement('table');t.className='tb';let h='<tr>'+q.table.header.map(c=>'<th>'+c+'</th>').join('')+'</tr>';q.table.rows.forEach((r,ri)=>{h+='<tr>'+r.map((c,ci)=>c===''?'<td data-c="'+ri+'_'+ci+'"></td>':'<td>'+c+'</td>').join('')+'</tr>'});t.innerHTML=h;
    let ci=0;t.querySelectorAll('td[data-c]').forEach(td=>{const e=q.tcells?q.tcells[ci]:null;const o=mk(q.tcells?'ans':'text',e,q.tcells&&typeof e=='number'?'num':'txt');td.appendChild(o.el);ci++});card.appendChild(t)}
  (q.fills||[]).forEach((row,ri)=>{const d=document.createElement('div');d.className='row';row.forEach((it,ii)=>{if(typeof it=='number'){const last=ri==q.fills.length-1&&ii==row.length-1||(ri==q.fills.length-1&&row.slice(ii+1).every(x=>typeof x!='number'));const o=mk(last&&q.exp!=null?'ans':'work',last?q.exp:null,'num');d.appendChild(o.el)}else if(it){const s=document.createElement('span');s.innerHTML=it;d.appendChild(s)}});card.appendChild(d)});
  if(q.parts){q.parts.forEach(p=>{const d=document.createElement('div');d.className='part';d.innerHTML=p.text;card.appendChild(d);
    if(p.kind=='ans'){const r=document.createElement('div');r.className='row';r.innerHTML='<span>'+esc(p.label||'')+'</span>';const o=mk(p.exp!=null?'ans':'text',p.exp,p.exp!=null?'num':'txt');r.appendChild(o.el);if(p.unit)r.insertAdjacentHTML('beforeend','<span class="u">'+esc(p.unit)+'</span>');card.appendChild(r)}
    else{const o=mk('text',null,'ta');o.el.placeholder='Write your answer here';card.appendChild(o.el)}})}
  else if(!q.fills&&!q.table&&!(q.blanks&&q.blanks.length)){
    if(q.unit!=null){const r=document.createElement('div');r.className='row';if(q.work){const o=mk('work',null,'ta');o.el.placeholder='Show your working here';o.el.style.minHeight='56px';card.appendChild(o.el)}
      r.innerHTML='<b>'+esc(q.label||'Answer:')+'</b>';const o=mk(q.exp!=null?'ans':'text',q.exp,q.exp!=null?'num':'txt');r.appendChild(o.el);r.insertAdjacentHTML('beforeend','<span class="u">'+esc(q.unit)+'</span>');card.appendChild(r)}
    else{const o=mk('text',null,'ta');o.el.placeholder='Write your answer here';card.appendChild(o.el)}}
  else if(q.table&&!q.tcells&&false){}
  const ans=ins.filter(x=>x.role=='ans'),txt=ins.filter(x=>x.role=='text');
  const auto=ans.length>0&&txt.length==0;
  const acts=document.createElement('div');acts.className='acts';
  const bC=document.createElement('button');bC.className='btn';bC.textContent='Check answer';
  const bM=document.createElement('button');bM.className='btn sec';bM.textContent='Show model answer';
  if(ans.length)acts.appendChild(bC);acts.appendChild(bM);card.appendChild(acts);
  const fb=document.createElement('div');fb.className='fb';card.appendChild(fb);
  const md=document.createElement('div');md.className='model';md.innerHTML='<b>Model answer:</b> '+q.ans;card.appendChild(md);
  const mkr=document.createElement('div');mkr.className='mark';mkr.innerHTML='<b>How did you do?</b>';
  [['correct','✓ I got it right'],['partly','~ Partly right'],['not','✗ Not yet']].forEach(([k,t])=>{const b=document.createElement('button');b.className='mk';b.textContent=t;b.onclick=()=>{S.mark=k;S.res=k;mkr.querySelectorAll('.mk').forEach(x=>x.className='mk');b.classList.add('s-'+k);card.classList.toggle('done',k=='correct');card.classList.toggle('part-done',k!='correct');upd()};mkr.appendChild(b)});card.appendChild(mkr);
  const hasText=()=>ins.some(o=>(o.el.value||'').trim());
  const gate=()=>{const any=hasText();bM.disabled=!any;bC.disabled=!any};gate();ins.forEach(o=>o.el.addEventListener('input',gate));
  const check=()=>{
    S.tries++;let allok=true,anyc=false;
    ans.forEach(o=>{const v=o.el.value;const ok=o.kind=='num'?numOK(v,o.exp):wordOK(v,o.exp);o.el.classList.remove('ok','bad');if((v||'').trim()){o.el.classList.add(ok?'ok':'bad')}else allok=false;if(!ok)allok=false;anyc=true});
    if(auto&&allok){S.auto='correct';S.res=S.mark||'correct';fb.className='fb ok';fb.innerHTML='✓ Correct! Well done.';card.classList.add('done');mkr.querySelectorAll('.mk').forEach(x=>x.className='mk');S.mark=null;S.res='correct';md.classList.add('show')}
    else if(allok&&!auto){fb.className='fb info';fb.innerHTML='Your calculated answer matches. Now compare the rest of your answer with the model answer and mark yourself.';md.classList.add('show');mkr.classList.add('show');S.revealed=true}
    else{S.auto='wrong';fb.className='fb bad';fb.innerHTML=S.tries<2?'Not quite. Check your working, the equation and the unit, then try again.':'Still not matching. Show the model answer, compare your working, then mark yourself.'}
    upd()};
  bC.onclick=check;
  card.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.tagName=='INPUT'&&ans.length){e.preventDefault();check()}});
  bM.onclick=()=>{md.classList.add('show');mkr.classList.add('show');S.revealed=true;upd()};
  S.ins=ins;S.auto_possible=auto;
  return card;
}
function buildQ(){
  const s=$('#s-q');s.innerHTML='<div class="call">'+(L.turn||'The questions get harder as you go. Type your answer, use <b>Check answer</b> for calculations, and <b>Show model answer</b> to compare. Then mark yourself honestly: this helps your report give the right advice.')+'</div>';
  L.qs.forEach((q,i)=>s.appendChild(qCard(q,i)));
  s.insertAdjacentHTML('beforeend','<div class="acts"><button class="btn" onclick="show(\''+(L.mcq&&L.mcq.length?'m':'r')+'\')">Next →</button></div>');
}
function buildM(){
  const s=$('#s-m');if(!(L.mcq&&L.mcq.length)){s.innerHTML='';return}
  s.innerHTML='<div class="call">Choose one answer for each question. You will see straight away if you are right.</div>';
  L.mcq.forEach((m,i)=>{const c=document.createElement('div');c.className='card';c.innerHTML='<div class="qh"><b>M'+(i+1)+'</b></div><div>'+m.q+'</div>'+m.opts.map((o,k)=>'<button class="opt" data-k="'+k+'"><b>'+'ABCD'[k]+'</b>'+o+'</button>').join('')+'<div class="fb"></div>';
    c.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;st.m[i].pick=k;c.querySelectorAll('.opt').forEach(x=>{x.disabled=true;const j=+x.dataset.k;if(j==m.ix)x.classList.add('c');else if(j==k)x.classList.add('w')});const fb=c.querySelector('.fb');fb.className='fb '+(k==m.ix?'ok':'bad');fb.innerHTML=(k==m.ix?'✓ Correct. ':'✗ Not quite. The answer is '+'ABCD'[m.ix]+'. ')+m.why;upd()});s.appendChild(c)});
  s.insertAdjacentHTML('beforeend','<div class="acts"><button class="btn" onclick="show(\'r\')">Finish: my report →</button></div>');
}
/* ---------- progress ---------- */
function doneQ(){return st.q.filter(x=>x.res).length}
function doneM(){return st.m.filter(x=>x.pick!=null).length}
function upd(){
  const nq=st.q.length,nm=st.m.length,d=doneQ()+doneM();
  $('#pb').style.width=(100*d/(nq+nm))+'%';
  const a=$('#ct-q');if(a)a.textContent=doneQ()+'/'+nq;const b=$('#ct-m');if(b)b.textContent=doneM()+'/'+nm;
  if($('#s-r').classList.contains('on'))buildR();
}
/* ---------- report ---------- */
function data(){
  const res=st.q.map((S,i)=>{const q=L.qs[i];const ans=(S.ins||[]).map(o=>(o.el.value||'').trim()).filter(Boolean);return{i:i+1,s:q.s,h:strip(q.h),q:strip(q.q),kind:q.kind,ans,model:strip(q.ans),res:S.res,by:S.mark?'self-marked':(S.res?'checked':''),revealed:S.revealed}});
  const mc=st.m.map((S,i)=>{const m=L.mcq[i];return{i:i+1,q:strip(m.q),pick:S.pick,ix:m.ix,opts:m.opts.map(strip),why:strip(m.why),ok:S.pick==m.ix}});
  return{res,mc}
}
function score(){
  const {res,mc}=data();let pts=0,tot=res.length+mc.length;res.forEach(r=>{pts+=r.res=='correct'?1:r.res=='partly'?0.5:0});mc.forEach(m=>{pts+=m.ok?1:0});
  return{pts,tot,pct:tot?Math.round(100*pts/tot):0,res,mc,c:res.filter(r=>r.res=='correct').length,p:res.filter(r=>r.res=='partly').length,n:res.filter(r=>r.res=='not').length,u:res.filter(r=>!r.res).length,mcok:mc.filter(m=>m.ok).length,mcdone:mc.filter(m=>m.pick!=null).length}
}
function keywords(){const o=[];(L.key||[]).forEach(k=>{(k.match(/<b>(.*?)<\/b>/g)||[]).forEach(b=>{const t=strip(b);if(t.length>2&&!o.includes(t)&&o.length<8)o.push(t)})});return o}
function suggestions(sc){
  const out=[];const pct=sc.pct,f=L.formula;
  out.push(pct>=85?'Excellent work. You have a secure understanding of this topic.':pct>=60?'Good progress. You understand the main ideas, and a few areas need more practice (see below).':'This topic needs more practice. Re-read the Learn it and Worked examples sections, then try the questions you missed again.');
  const band=(lo,hi)=>{const r=sc.res.filter(x=>x.s>=lo&&x.s<=hi&&x.res);if(!r.length)return null;return r.reduce((a,x)=>a+(x.res=='correct'?1:x.res=='partly'?.5:0),0)/r.length};
  const e=band(1,2),h=band(4,5),m=band(3,3);
  if(e!=null&&e<.6)out.push('The first questions were not secure yet. Go back to the step-by-step method and the worked examples, and copy each step on paper before trying again.');
  else if(e!=null&&h!=null&&h<.5)out.push('You are secure on the basics. To improve, practise the harder multi-step questions: write down what you know, choose the equation, then work through one step at a time.');
  const w=L.watch||[];let wi=0;
  sc.res.filter(r=>r.res&&r.res!='correct').forEach(r=>{
    let s='Question '+r.i+' ('+(r.s)+' star): ';
    if(r.kind=='calc')s+='check that you wrote the equation'+(f?' ('+f.eq+')':'')+', used the right units, and gave the unit in your answer.'+(w[wi%Math.max(w.length,1)]?' Remember: '+strip(w[wi++%w.length]):'');
    else s+='use the key words ('+keywords().slice(0,5).join(', ')+') and give a reason in each sentence.';
    out.push(s)});
  const un=sc.res.filter(r=>!r.res).map(r=>r.i);if(un.length)out.push('Questions not finished: '+un.join(', ')+'. Complete them to get a full report.');
  sc.mc.filter(m=>m.pick!=null&&!m.ok).forEach(m=>out.push('Quick choice M'+m.i+': '+m.why));
  if(st.lvl=='sup'&&pct>=80)out.push('You are ready for the Extend worksheet on this topic.');
  if(st.lvl=='ext'&&pct<50)out.push('Try the Support worksheet on this topic first, then come back to Extend.');
  return out;
}
function buildR(){
  const sc=score(),s=$('#s-r'),sg=suggestions(sc);
  const done=sc.tot-sc.u-(sc.mc.length-sc.mcdone);
  let h='<div class="card"><h2>My report</h2><div><b>'+esc(st.name)+'</b> · '+esc(st.cls)+' · '+L.name+' level</div><div class="sum"><div><b>'+sc.pct+'%</b>score</div><div><b>'+sc.c+'</b>correct</div><div><b>'+sc.p+'</b>partly</div><div><b>'+sc.n+'</b>not yet</div><div><b>'+sc.mcok+'/'+sc.mc.length+'</b>quick choices</div></div>';
  h+='<div class="bar"><i style="width:'+100*sc.c/sc.tot+'%;background:var(--ok)"></i><i style="width:'+100*sc.p/sc.tot+'%;background:#e0a526"></i><i style="width:'+100*sc.n/sc.tot+'%;background:var(--no)"></i><i style="width:'+100*sc.mcok/sc.tot+'%;background:#4caf7a"></i></div>';
  h+='<p style="color:var(--mute)">Completed '+done+' of '+sc.tot+' questions.</p></div>';
  h+='<div class="card"><h2>Suggestions for improvement</h2><ul class="sg">'+sg.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div>';
  h+='<div class="card"><h2>Question summary</h2><table class="res"><tr><th>Question</th><th>Level</th><th>Result</th></tr>'+sc.res.map(r=>'<tr><td>Q'+r.i+'</td><td>'+stars(r.s)+'</td><td class="r-'+(r.res||'none')+'">'+({correct:'Correct',partly:'Partly right',not:'Not yet'}[r.res]||'Not answered')+'</td></tr>').join('')+sc.mc.map(m=>'<tr><td>M'+m.i+'</td><td></td><td class="r-'+(m.pick==null?'none':m.ok?'correct':'not')+'">'+(m.pick==null?'Not answered':m.ok?'Correct':'Not yet')+'</td></tr>').join('')+'</table></div>';
  h+='<div class="acts"><button class="btn or big" id="dl">Download my report (PDF)</button><span style="color:var(--mute)">The PDF is made on your device. Nothing is sent anywhere.</span></div><div class="err" id="dlmsg"></div>';
  s.innerHTML=h;$('#dl').onclick=makePDF;
}
function fname(){return 'Worksheet_'+D.code+'_'+D.title.replace(/[^A-Za-z0-9]+/g,'_')+'_'+L.name+'_report_'+st.name.replace(/[^A-Za-z0-9]+/g,'_')+'.pdf'}
function makePDF(){
  const sc=score(),sg=suggestions(sc),P=MiniPDF();if(LOGO_PDF)P.setLogo(LOGO_PDF);
  P.logoHeader(120);
  P.h1('Worksheet '+D.code+': '+D.title+' - completion report');
  P.text(D.chapter+'  |  '+L.name+' worksheet',{size:10,color:[93,111,124]});
  const dt=new Date(),mins=Math.max(1,Math.round((Date.now()-st.t0)/60000));
  P.kv('Name',st.name);P.kv('Class',st.cls);P.kv('Date',dt.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}));P.kv('Time spent',mins+' minute'+(mins==1?'':'s'));
  const done=sc.tot-sc.u-(sc.mc.length-sc.mcdone);
  P.kv('Completed',done+' of '+sc.tot+' questions');
  P.h2('Results');
  P.bar('Overall score',sc.pct/100,sc.pct+'%  ('+sc.pts+' of '+sc.tot+' marks)');
  P.table(['Question type','Correct','Partly right','Not yet','Not answered'],[['Worksheet questions (1-'+sc.res.length+')',sc.c,sc.p,sc.n,sc.u],['Quick choices',sc.mcok,'-',sc.mcdone-sc.mcok,sc.mc.length-sc.mcdone]],[3,1.2,1.2,1.2,1.4],{boldFirst:true});
  P.h2('Suggestions for improvement');
  sg.forEach(x=>P.text('- '+x,{size:10,indent:8,after:4}));
  P.h2('Your answers');
  sc.res.forEach(r=>{
    P.text('Question '+r.i+'   '+'*'.repeat(r.s)+'-'.repeat(5-r.s)+'   '+({correct:'CORRECT',partly:'PARTLY RIGHT',not:'NOT YET'}[r.res]||'NOT ANSWERED')+(r.by?'  ('+r.by+')':''),{size:10,bold:true,color:r.res=='correct'?[31,138,76]:r.res=='partly'?[183,121,31]:r.res=='not'?[192,57,43]:[93,111,124],after:1});
    P.text(r.q,{size:9.5,indent:8,after:2});
    P.text('Your answer: '+(r.ans.length?r.ans.join('  |  '):'(no answer)'),{size:9.5,indent:8,after:2,color:[47,107,151]});
    if(r.revealed||r.res)P.text('Model answer: '+r.model,{size:9.5,indent:8,after:7,color:[93,111,124]});else P.gap(5);
  });
  if(sc.mc.length){P.h2('Quick choices');
    sc.mc.forEach(m=>{P.text('M'+m.i+'  '+m.q,{size:9.5,bold:true,after:1});P.text('Your answer: '+(m.pick==null?'(not answered)':'ABCD'[m.pick]+'. '+m.opts[m.pick])+(m.pick!=null&&!m.ok?'   |   Correct answer: '+'ABCD'[m.ix]+'. '+m.opts[m.ix]:'   (correct)'),{size:9.5,indent:8,after:6,color:m.pick==null?[93,111,124]:m.ok?[31,138,76]:[192,57,43]})})}
  P.save(fname(),'Worksheet '+D.code+' report - '+st.name,'The Aquila School  -  Physics  -  '+st.name+' ('+st.cls+')');
  $('#dlmsg').textContent='Your report has been downloaded. Check your Downloads folder.';
}
window.__t={D,st,init,show,score,data,suggestions,makePDF,parseNum,numOK};
