<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crossword</title><style>
:root{--b:#2F6B97;--bd:#24557a;--bm:#7BAED4;--bl:#9CD6EA;--t:#EAF4FA;--t2:#D3E8F5;--ink:#1c2b36;--mute:#5d6f7c;--or:#F36F21;--ok:#1f8a4c;--okb:#e3f5ea;--no:#c0392b;--nob:#fbe9e7;--am:#b7791f;--amb:#fff4dc;--line:#C5D9E8}
*{box-sizing:border-box}
body{margin:0;font-family:Lato,Inter,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#f4f9fc;line-height:1.5;font-size:16px}
header{background:#fff;border-bottom:4px solid var(--bl);position:relative}
header:before{content:"";display:block;height:12px;background:var(--b)}
.hd{max-width:960px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:18px}
.hd img{height:64px}
.hd h1{margin:0;font-size:22px;color:var(--b);line-height:1.2}
.hd small{color:var(--mute);display:block;font-size:13px}
.hd .who{margin-left:auto;text-align:right;font-size:13px;color:var(--mute)}
nav{position:sticky;top:0;z-index:5;background:var(--b);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.nv{max-width:960px;margin:0 auto;display:flex;gap:2px;padding:0 10px;overflow-x:auto}
.nv button{background:none;border:0;color:#dbeaf5;padding:11px 14px;font:inherit;font-weight:700;cursor:pointer;border-bottom:4px solid transparent;white-space:nowrap}
.nv button.on{color:#fff;border-bottom-color:var(--or)}
.nv button .ct{font-weight:400;font-size:12px;opacity:.85;margin-left:4px}
.prog{height:5px;background:#1e4a69}.prog i{display:block;height:100%;width:0;background:var(--bl);transition:width .3s}
main{max-width:960px;margin:0 auto;padding:18px}
section{display:none}section.on{display:block}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 16px}
.card h2,section>h2{margin:0 0 8px;color:var(--b);font-size:19px}
.call{background:var(--t);border-left:5px solid var(--b);padding:10px 14px;border-radius:4px;margin:0 0 14px}
.tipb{background:#F2F8FC;border-left:5px solid var(--bm);padding:10px 14px;border-radius:4px;margin:12px 0}
.watch{background:#DCEEF8;border-left:5px solid var(--or);padding:10px 14px;border-radius:4px;margin:12px 0}
.watch b.t{color:var(--or)}
.watch ul{margin:6px 0 0;padding-left:20px}
.obj{margin:4px 0}.obj b{color:var(--b)}
.fbox{display:flex;gap:18px;flex-wrap:wrap;align-items:center;background:var(--t);border:1px solid var(--bl);border-radius:10px;padding:14px}
.fbox .eq{font-size:26px;font-weight:800;color:var(--b)}
.fbox table{border-collapse:collapse;margin-top:8px}
.fbox th{background:var(--b);color:#fff;padding:5px 10px;text-align:left;font-size:14px}.fbox td{padding:5px 10px;border:1px solid var(--line);background:#fff;font-size:14px}
.tri svg{width:210px;height:auto;cursor:pointer}.tri .z{fill:var(--t2);stroke:var(--b);stroke-width:2;transition:fill .15s}.tri .z:hover{fill:#bfdcef}.tri .z.cov{fill:#8fa3b2}.tri text{font-weight:800;fill:var(--b);font-size:17px;pointer-events:none;text-anchor:middle}.tri .z.cov+text{fill:#8fa3b2}
.tri .cap{font-weight:700;color:var(--bd);min-height:24px;text-align:center;font-size:16px}
ol.steps{padding-left:0;list-style:none;counter-reset:s}ol.steps li{counter-increment:s;padding:3px 0 3px 34px;position:relative}ol.steps li:before{content:counter(s);position:absolute;left:0;top:3px;width:24px;height:24px;border-radius:50%;background:var(--b);color:#fff;font-weight:700;text-align:center;line-height:24px;font-size:13px}
table.w{width:100%;border-collapse:collapse;margin:8px 0}
table.w th{background:var(--b);color:#fff;text-align:left;padding:7px 10px;font-size:14px}
table.w td{padding:7px 10px;border:1px solid var(--line);vertical-align:middle}
table.w tr:nth-child(even) td{background:var(--t)}table.w tr.last td{background:var(--t2);font-weight:700}
table.w tr.hid{display:none}
table.w tr.new td{animation:fl .8s}@keyframes fl{from{background:#fff3c4}}
.btn{background:var(--b);color:#fff;border:0;border-radius:8px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}.btn:hover{background:var(--bd)}.btn.sec{background:#fff;color:var(--b);border:2px solid var(--b)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.big{padding:12px 22px;font-size:17px}
.btn.or{background:var(--or)}
.chk{color:var(--ok);font-weight:700;margin-top:6px}
.stars{color:var(--b);letter-spacing:1px}.stars i{color:#b8c4ce;font-style:normal}
.qh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:4px}.qh b{font-size:17px}.qh em{color:var(--mute)}
.qimg{max-width:100%;height:auto;border-radius:6px;margin:6px 0;display:block}
input.in,textarea.in,input.blank{font:inherit;border:2px solid var(--line);border-radius:6px;padding:5px 8px;background:#fff;color:var(--ink)}
input.in{width:130px}input.blank{width:120px;display:inline-block;margin:0 3px}textarea.in{width:100%;min-height:74px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--b)}
.ok{border-color:var(--ok)!important;background:var(--okb)!important}.bad{border-color:var(--no)!important;background:var(--nob)!important}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:7px 0}.row .u{color:var(--mute)}
.part{margin:10px 0 2px}
table.tb{border-collapse:collapse;margin:8px 0;max-width:100%}table.tb th{background:var(--b);color:#fff;padding:6px 10px;text-align:left}table.tb td{border:1px solid var(--line);padding:5px 8px}table.tb input.in{width:100%;min-width:90px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.fb{margin-top:8px;padding:8px 12px;border-radius:6px;display:none}.fb.ok{display:block;background:var(--okb);color:#14502d;border:1px solid var(--ok)}.fb.bad{display:block;background:var(--nob);color:#7b241c;border:1px solid var(--no)}.fb.info{display:block;background:var(--t);border:1px solid var(--bl)}
.model{display:none;margin-top:10px;background:var(--amb);border-left:5px solid var(--am);padding:9px 12px;border-radius:4px}.model.show{display:block}
.mark{display:none;margin-top:8px;gap:8px;flex-wrap:wrap;align-items:center}.mark.show{display:flex}
.mk{border:2px solid var(--line);background:#fff;border-radius:20px;padding:5px 14px;font:inherit;cursor:pointer;font-weight:700}
.mk.s-correct{border-color:var(--ok);background:var(--okb);color:#14502d}.mk.s-partly{border-color:var(--am);background:var(--amb);color:#7a4b00}.mk.s-not{border-color:var(--no);background:var(--nob);color:#7b241c}
.done{border-left:6px solid var(--ok)}.card.part-done{border-left:6px solid var(--am)}
.opt{display:block;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:8px;padding:8px 12px;margin:5px 0;font:inherit;cursor:pointer}.opt:hover{border-color:var(--b)}.opt:disabled{cursor:default;color:var(--ink)}.opt.c{border-color:var(--ok);background:var(--okb)}.opt.w{border-color:var(--no);background:var(--nob)}.opt b{color:var(--b);margin-right:8px}
.lvl{display:flex;gap:10px;margin:8px 0}.lvl label{flex:1;border:2px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;background:#fff}.lvl input{margin-right:6px}.lvl label.sel{border-color:var(--b);background:var(--t)}
#start{position:fixed;inset:0;background:rgba(20,50,72,.72);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
#start .box{background:#fff;border-radius:14px;max-width:520px;width:100%;padding:24px;border-top:10px solid var(--b)}
#start img{height:70px}
#start label.f{display:block;font-weight:700;margin-top:12px}#start input[type=text]{width:100%;margin-top:4px;font-size:17px}
.err{color:var(--no);font-weight:700;min-height:22px;margin-top:6px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0}.sum div{background:var(--t);border:1px solid var(--bl);border-radius:10px;text-align:center;padding:10px}.sum b{display:block;font-size:26px;color:var(--b)}
.bar{height:16px;background:var(--t2);border-radius:8px;overflow:hidden;display:flex;margin:6px 0}.bar i{display:block;height:100%}
.sg{margin:6px 0;padding-left:20px}.sg li{margin:6px 0}
table.res{width:100%;border-collapse:collapse}table.res th{background:var(--b);color:#fff;padding:6px 9px;text-align:left}table.res td{border:1px solid var(--line);padding:5px 9px}
.r-correct{color:var(--ok);font-weight:700}.r-partly{color:var(--am);font-weight:700}.r-not{color:var(--no);font-weight:700}.r-none{color:var(--mute)}
footer{text-align:center;color:var(--mute);font-size:12px;padding:18px}
@media(max-width:600px){.hd img{height:48px}.hd h1{font-size:17px}.hd .who{display:none}input.in{width:100px}}

.fc{perspective:900px;max-width:560px;margin:10px auto}.fc .in2{position:relative;min-height:250px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}.fc.flip .in2{transform:rotateY(180deg)}
.fc .f,.fc .b{position:absolute;inset:0;backface-visibility:hidden;border-radius:14px;border:2px solid var(--bl);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;text-align:center;box-shadow:0 3px 10px rgba(47,107,151,.12)}
.fc .b{transform:rotateY(180deg);background:var(--t)}
.fc .term{font-size:34px;font-weight:800;color:var(--b)}.fc .hint{color:var(--mute);font-size:13px;margin-top:10px}
.fc .def{font-size:17px;margin-bottom:10px}.tr{display:flex;gap:18px;flex-wrap:wrap;justify-content:center}
.ar{font-family:"Segoe UI",Tahoma,Arial,sans-serif;font-size:26px;direction:rtl;color:#222}.ru{font-size:22px;font-weight:700;color:var(--or)}
.say{background:#fff;border:2px solid var(--b);color:var(--b);border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer;margin-top:10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:10px 0}
.tile{background:#fff;border:2px solid var(--line);border-radius:10px;padding:12px 10px;text-align:center;cursor:pointer;font:inherit;min-height:54px;font-size:15px}.tile:hover{border-color:var(--b)}.tile.sel{border-color:var(--b);background:var(--t2)}.tile.done{border-color:var(--ok);background:var(--okb);cursor:default;opacity:.8}.tile.wrong{border-color:var(--no);background:var(--nob)}
.tile.ar{font-size:22px}.tile.ru{font-size:17px;color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:2px solid var(--b);border-radius:20px;overflow:hidden;margin:0 6px 6px 0}.seg button{border:0;background:#fff;color:var(--b);padding:6px 14px;font:inherit;font-weight:700;cursor:pointer}.seg button.on{background:var(--b);color:#fff}
.stat{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);margin:6px 0}
.qterm{font-size:19px;margin:6px 0 10px}
</style><style>
.grid{display:grid;gap:0;user-select:none;touch-action:none;margin:0 auto;border:2px solid var(--b);background:#fff;width:max-content;max-width:100%}
.ws .c{width:var(--cs);height:var(--cs);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(var(--cs)*.5);color:var(--ink);border:1px solid #dbe7f0;cursor:pointer}
.ws .c.sel{background:#ffe2c9}
.ws .c.f0{background:#cfe8f7}.ws .c.f1{background:#d9f0d0}.ws .c.f2{background:#fde6b8}.ws .c.f3{background:#e6d6f5}.ws .c.f4{background:#ffd6d6}.ws .c.f5{background:#cdeee9}
.ws .c.hint{outline:3px solid var(--or);outline-offset:-3px}
.layout{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start}
.layout>.gcol{flex:1 1 auto;min-width:0;overflow-x:auto}.layout>.side{flex:0 0 250px;min-width:220px}
.wl{list-style:none;margin:0;padding:0;columns:2;column-gap:14px}.wl li{padding:3px 6px;border-radius:5px;break-inside:avoid;font-weight:700;color:var(--bd);font-size:14px}
.wl li.got{text-decoration:line-through;color:#7b8a96;background:var(--okb)}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin:0 0 10px;font-weight:700;color:var(--bd)}.stat span{background:var(--t);border:1px solid var(--bl);border-radius:20px;padding:3px 12px}
.cw .cell{position:relative;width:var(--cs);height:var(--cs);border:1px solid var(--ink);background:#fff}
.cw .cell.blk{border:0;background:transparent}
.cw .cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font:800 calc(var(--cs)*.55) Lato,Arial,sans-serif;text-transform:uppercase;color:var(--bd);padding:0;caret-color:transparent;cursor:pointer}
.cw .cell input:focus{outline:none}
.cw .cell .n{position:absolute;left:2px;top:0;font-size:calc(var(--cs)*.28);font-weight:700;color:var(--b);pointer-events:none}
.cw .cell.cur{background:#ffe2c9}.cw .cell.inw{background:#dff0fa}
.cw .cell.right{background:#d8f2e2}.cw .cell.wrong{background:#fbd9d5}
.cl{list-style:none;margin:0 0 12px;padding:0}.cl li{padding:5px 8px;border-radius:6px;cursor:pointer;font-size:14px;border:1px solid transparent}
.cl li:hover{background:var(--t)}.cl li.on{background:#ffe9d6;border-color:var(--or)}.cl li.ok{color:#14502d}.cl li.ok:before{content:"✓ ";font-weight:800}
.cl li b{color:var(--b)}.cl li i{color:var(--mute);font-style:normal}
.side h3{margin:8px 0 4px;color:var(--b);font-size:16px}
.win{display:none;background:var(--okb);border:2px solid var(--ok);border-radius:12px;padding:14px 18px;margin:0 0 14px;color:#14502d}.win.show{display:block}.win h2{margin:0 0 4px;color:#14502d}
.who2{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}.who2 input{font:inherit;border:2px solid var(--line);border-radius:6px;padding:5px 8px;width:170px}
</style></head><body>
<header><div class="hd"><img id="lg" alt="The Aquila School"><div><h1 id="ttl"></h1><small id="sub"></small></div><div class="who" id="who"></div></div></header>

const $=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e};
let t0=null,timer=null,done=false;
function tick(){const s=Math.floor((Date.now()-t0)/1000);const e=document.getElementById('tm');if(e)e.textContent=Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function startTimer(){if(t0===null){t0=Date.now();timer=setInterval(tick,500)}}
function finish(extra){if(done)return;done=true;clearInterval(timer);tick();const s=Math.floor((Date.now()-t0)/1000);
  const n=document.getElementById('nm').value.trim(),c=document.getElementById('cl').value.trim();
  document.getElementById('wintxt').innerHTML=(n?'<b>'+n.replace(/</g,'&lt;')+'</b>'+(c?' ('+c.replace(/</g,'&lt;')+')':'')+', you':'You')+' completed the '+D.kind.toLowerCase()+' in <b>'+Math.floor(s/60)+' min '+(s%60)+' s</b>'+(extra||'')+'.';
  document.getElementById('win').classList.add('show');document.getElementById('win').scrollIntoView({behavior:'smooth',block:'nearest'})}
const app=document.getElementById('app');
if(D.kind==='Word search')ws();else cw();

/* ---------------- word search ---------------- */
function ws(){
 document.getElementById('how').innerHTML='<b>How to play:</b> find every key word hidden in the grid. Words run across, down or diagonally, forwards or backwards. <b>Click or touch the first letter, drag to the last letter, then let go.</b> Found words are coloured and crossed off the list.';
 const g=D.grid,n=g.length,words=D.words.slice();let found={};
 const cs=Math.max(24,Math.min(36,Math.floor(560/n)));
 app.innerHTML='<div class="stat"><span>⏱ <b id="tm">0:00</b></span><span>Found <b id="fc">0</b> / '+words.length+'</span></div><div class="layout ws"><div class="gcol"><div class="grid" id="gr" style="--cs:'+cs+'px;grid-template-columns:repeat('+n+',var(--cs))"></div></div><div class="side"><h3>Words to find</h3><ul class="wl" id="wl"></ul><div class="acts"><button class="btn sec" id="hb">Hint</button><button class="btn sec" id="sb">Show answers</button><button class="btn sec" id="rb">Restart</button></div></div></div>';
 const gr=document.getElementById('gr'),cells=[];
 for(let y=0;y<n;y++)for(let x=0;x<n;x++){const c=$('div','c',g[y][x]);c.dataset.x=x;c.dataset.y=y;gr.appendChild(c);cells.push(c)}
 const wl=document.getElementById('wl');const lis={};
 words.slice().sort().forEach(w=>{const li=$('li','',w);wl.appendChild(li);lis[w]=li});
 let start=null,path=[];
 const at=(x,y)=>cells[y*n+x];
 function line(a,b){const dx=b.x-a.x,dy=b.y-a.y;const L=Math.max(Math.abs(dx),Math.abs(dy));
  if(!(dx===0||dy===0||Math.abs(dx)===Math.abs(dy)))return [a];
  const sx=Math.sign(dx),sy=Math.sign(dy);const p=[];for(let i=0;i<=L;i++)p.push({x:a.x+sx*i,y:a.y+sy*i});return p}
 function pos(e){const el=document.elementFromPoint(e.clientX,e.clientY);if(el&&el.classList.contains('c'))return{x:+el.dataset.x,y:+el.dataset.y};return null}
 function show(){cells.forEach(c=>c.classList.remove('sel'));path.forEach(p=>at(p.x,p.y).classList.add('sel'))}
 gr.addEventListener('pointerdown',e=>{const p=pos(e);if(!p||done)return;startTimer();start=p;path=[p];show();try{gr.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
 gr.addEventListener('pointermove',e=>{if(!start)return;const p=pos(e);if(!p)return;path=line(start,p);show()});
 const up=()=>{if(!start)return;const s=path.map(p=>g[p.y][p.x]).join('');const r=s.split('').reverse().join('');
  const w=words.find(w=>!found[w]&&(w===s||w===r));
  if(w&&path.length>1){found[w]=path.slice();const k='f'+(Object.keys(found).length-1)%6;path.forEach(p=>at(p.x,p.y).classList.add(k));lis[w].classList.add('got');document.getElementById('fc').textContent=Object.keys(found).length;
   cells.forEach(c=>c.classList.remove('hint'));
   if(Object.keys(found).length===words.length)finish('')}
  start=null;path=[];show()};
 gr.addEventListener('pointerup',up);gr.addEventListener('pointercancel',up);
 document.getElementById('hb').onclick=()=>{const w=words.find(w=>!found[w]);if(!w)return;startTimer();cells.forEach(c=>c.classList.remove('hint'));const p=D.place[w][0];at(p[0],p[1]).classList.add('hint');hints++;};
 let hints=0;
 document.getElementById('sb').onclick=()=>{words.forEach(w=>{if(!found[w]){D.place[w].forEach(p=>at(p[0],p[1]).classList.add('hint'));lis[w].classList.add('got')}});clearInterval(timer)};
 document.getElementById('rb').onclick=()=>{location.reload()};
}

/* ---------------- crossword ---------------- */
function cw(){
 document.getElementById('how').innerHTML='<b>How to play:</b> click a square (or a clue) and type the answer. Click the same square again to switch between <b>across</b> and <b>down</b>. Use the arrow keys to move. Press <b>Check</b> to see which letters are right.';
 const W=D.W,H=D.H,ws=D.words;const cs=Math.max(28,Math.min(40,Math.floor(560/W)));
 const grid={};ws.forEach((w,i)=>{for(let k=0;k<w.w.length;k++){const x=w.x+(w.d==='A'?k:0),y=w.y+(w.d==='D'?k:0);const key=x+','+y;(grid[key]=grid[key]||{ch:w.w[k],ws:[]}).ws.push(i)}});
 app.innerHTML='<div class="stat"><span>⏱ <b id="tm">0:00</b></span><span>Words correct <b id="fc">0</b> / '+ws.length+'</span></div><div class="layout cw"><div class="gcol"><div class="grid" id="gr" style="--cs:'+cs+'px;grid-template-columns:repeat('+W+',var(--cs));border:0;background:none"></div><div class="acts"><button class="btn" id="ck">Check</button><button class="btn sec" id="rw">Reveal word</button><button class="btn sec" id="ra">Reveal all</button><button class="btn sec" id="cr">Clear</button></div></div><div class="side"><h3>Across</h3><ul class="cl" id="ca"></ul><h3>Down</h3><ul class="cl" id="cd"></ul></div></div>';
 const gr=document.getElementById('gr'),el={};
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){const key=x+','+y,c=$('div','cell'+(grid[key]?'':' blk'));
  if(grid[key]){const inp=document.createElement('input');inp.maxLength=1;inp.autocomplete='off';inp.setAttribute('aria-label','Row '+(y+1)+' column '+(x+1));inp.dataset.k=key;c.appendChild(inp);el[key]={c,inp};
   const num=D.nums[key];if(num)c.appendChild($('span','n',num))}
  gr.appendChild(c)}
 const lis=[];
 ws.forEach((w,i)=>{const li=$('li','','<b>'+w.n+'</b> '+w.clue.replace(/</g,'&lt;')+' <i>('+w.w.length+')</i>');li.onclick=()=>{startTimer();sel(i,w.x,w.y,true)};document.getElementById(w.d==='A'?'ca':'cd').appendChild(li);lis[i]=li});
 let cur=null,dir='A',curw=null;
 const cellsOf=i=>{const w=ws[i];return Array.from({length:w.w.length},(_,k)=>(w.x+(w.d==='A'?k:0))+','+(w.y+(w.d==='D'?k:0)))};
 const wordsAt=key=>grid[key].ws;
 function pick(key){const a=wordsAt(key).filter(i=>ws[i].d===dir);return a.length?a[0]:wordsAt(key)[0]}
 function sel(i,x,y,focus){curw=i;dir=ws[i].d;cur=(x!=null?x+','+y:cellsOf(i)[0]);paint();if(focus!==false)el[cur].inp.focus()}
 function paint(){Object.values(el).forEach(o=>o.c.classList.remove('cur','inw'));lis.forEach(l=>l.classList.remove('on'));
  if(curw==null)return;cellsOf(curw).forEach(k=>el[k].c.classList.add('inw'));if(cur)el[cur].c.classList.add('cur');lis[curw].classList.add('on');lis[curw].scrollIntoView({block:'nearest'})}
 function step(key,d,s){const [x,y]=key.split(',').map(Number);const nk=(d==='A'?x+s:x)+','+(d==='D'?y+s:y);return grid[nk]?nk:null}
 function count(){let ok=0;ws.forEach((w,i)=>{const good=cellsOf(i).every((k,j)=>(el[k].inp.value||'').toUpperCase()===w.w[j]);lis[i].classList.toggle('ok',good);if(good)ok++});document.getElementById('fc').textContent=ok;return ok}
 Object.entries(el).forEach(([key,o])=>{
  o.inp.addEventListener('focus',()=>{startTimer();if(cur===key&&curw!=null)return;cur=key;if(curw==null||!wordsAt(key).includes(curw)){curw=pick(key)}dir=ws[curw].d;paint()});
  o.inp.addEventListener('mousedown',()=>{if(cur===key&&wordsAt(key).length>1){const o2=wordsAt(key).find(i=>i!==curw);if(o2!=null){setTimeout(()=>{curw=o2;dir=ws[o2].d;paint()},0)}}});
  o.inp.addEventListener('keydown',e=>{
   const k=e.key;
   if(k.length===1&&/[a-zA-Z]/.test(k)){e.preventDefault();o.inp.value=k.toUpperCase();o.c.classList.remove('right','wrong');const nx=step(key,dir,1);if(nx&&wordsAt(nx).includes(curw)){cur=nx;el[nx].inp.focus();paint()}else paint();check();return}
   if(k==='Backspace'){e.preventDefault();if(o.inp.value){o.inp.value=''}else{const pv=step(key,dir,-1);if(pv&&wordsAt(pv).includes(curw)){el[pv].inp.value='';cur=pv;el[pv].inp.focus()}}o.c.classList.remove('right','wrong');paint();count();return}
   const mv={ArrowRight:['A',1],ArrowLeft:['A',-1],ArrowDown:['D',1],ArrowUp:['D',-1]}[k];
   if(mv){e.preventDefault();const nx=step(key,mv[0],mv[1]);if(nx){dir=mv[0];cur=nx;curw=pick(nx);if(ws[curw].d!==dir){const alt=wordsAt(nx).find(i=>ws[i].d===dir);if(alt!=null)curw=alt}el[nx].inp.focus();paint()}return}
   if(k==='Tab')return;
   if(k.length===1)e.preventDefault()});
  o.inp.addEventListener('input',()=>{o.inp.value=o.inp.value.slice(-1).toUpperCase();check()});
 });
 function check(){const ok=count();if(ok===ws.length&&Object.values(el).every(o=>o.inp.value))finish(revealed?' (with some letters revealed)':'')}
 let revealed=false;
 document.getElementById('ck').onclick=()=>{Object.entries(el).forEach(([k,o])=>{o.c.classList.remove('right','wrong');if(!o.inp.value)return;o.c.classList.add(o.inp.value.toUpperCase()===grid[k].ch?'right':'wrong')});count()};
 document.getElementById('rw').onclick=()=>{if(curw==null)return;revealed=true;cellsOf(curw).forEach(k=>{el[k].inp.value=grid[k].ch;el[k].c.classList.add('right')});count()};
 document.getElementById('ra').onclick=()=>{revealed=true;clearInterval(timer);Object.entries(el).forEach(([k,o])=>{o.inp.value=grid[k].ch;o.c.classList.add('right')});count()};
 document.getElementById('cr').onclick=()=>{Object.values(el).forEach(o=>{o.inp.value='';o.c.classList.remove('right','wrong')});count()};
 sel(0,null,null,false);
}
</script></body></html>
